name: Capacitor Android CI
on:
  push:
    branches: [web-capacitor-migration]
    paths: ['web/**', '.github/workflows/capacitor-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capacitor-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: node --check app.js && node --check notes-view.js && node --check curriculum-view.js && node --check database.js && node --check content-packages.js && node --check content-admin.js && node --check app-config.js && node --check pdf-viewer.js
      - name: Test content package validation
        run: npm test
      - name: Build offline web app
        run: npm run build
        env:
          CONTENT_ADMIN_ENABLED: 'false'
      - name: Verify offline web bundle
        run: |
          test -s www/index.html
          test -s www/vendor/pdfjs/pdf.worker.mjs
          test -s www/pdf-assets.json
          grep -q 'CONTENT_ADMIN_ENABLED = false' www/app-config.js
          grep -q 'id="content-admin-open" class="admin-entry" hidden' www/index.html
      - name: Package standalone HTML version
        run: |
          cd www
          zip -qr ../al-tafawuq-html.zip .
          cd ..
          unzip -t al-tafawuq-html.zip
      - name: Generate Android wrapper
        run: npx cap add android
      - name: Apply branded Android launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density=$1
            size=$2
            mkdir -p "android/app/src/main/res/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" icon.svg > "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: web/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Verify APK archive
        run: unzip -t android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK and HTML test packages
        uses: actions/upload-artifact@v4
        with:
          name: al-tafawuq-test-packages
          path: |
            web/android/app/build/outputs/apk/debug/app-debug.apk
            web/al-tafawuq-html.zip
          if-no-files-found: error
          retention-days: 7
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r web/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p sd.bokerpharma.altafawuq 1
            adb shell 'for i in $(seq 1 20); do pidof sd.bokerpharma.altafawuq && exit 0; sleep 1; done; exit 1'
