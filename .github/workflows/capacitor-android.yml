name: Capacitor Android CI
on:
  push:
    branches: [web-capacitor-migration]
    paths: ['web/**', '.github/workflows/capacitor-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capacitor-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: node --check app.js && node --check database.js && node --check content-packages.js && node --check content-admin.js && node --check app-config.js && node --check pdf-viewer.js
      - name: Test content package validation
        run: npm test
      - name: Build offline web app
        run: npm run build
        env:
          CONTENT_ADMIN_ENABLED: 'true'
      - name: Generate Android wrapper
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: web/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: al-tafawuq-capacitor-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
