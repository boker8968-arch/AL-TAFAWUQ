name: Capacitor Android CI
on:
  push:
    branches: [web-capacitor-migration]
    paths: ['web/**', '.github/workflows/capacitor-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build offline web app
        run: npm run build
      - name: Generate Android wrapper
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: web/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: al-tafawuq-capacitor-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
